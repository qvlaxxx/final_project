{% extends "base.html" %}

{% block title %}
Профіль
{% endblock title %}

{% block maincontent %}

<form action="/profile" method="POST" class="form-card">
    <label for="username">Username</label><br>
   <input value="{{ current_user.username }}" type="text" name="username" id="username"><br>

    <label for="password">Password</label><br>
    <input type="password" name="password" id="password"><br>

    <button type="submit">Save</button>
</form>
{% endblock maincontent %}
