{% extends "base.html" %}

{% block title %}{{ dishes.name }}{% endblock title %}

{% block maincontent %}
<div class="container mt-4">
    {% if dishes.image %}
    <div class="dish-detail">
        <img src="{{ url_for('static', filename=dishes.image) }}" class="dish-detail-image" alt="{{ dishes.name }}">
        <div class="dish-detail-body">
            <h2 class="dish-detail-title">{{ dishes.name }}</h2>
            <p class="dish-detail-text">{{ dishes.details_description }}</p>
            <p class="dish-detail-price">{{ dishes.price }} грн</p>
            <div class="card-actions">
                <form action="/basket/add" method="POST">
                    <input type="hidden" name="dish_id" value="{{ dishes.id }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <button type="submit" class="btn">Додати в кошик</button>
                </form>
            </div>
        </div>
    </div>
    {% endif %}
</div>
{% endblock maincontent %}
